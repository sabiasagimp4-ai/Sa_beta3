name: YMM4 build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download latest YMM4 Lite
        shell: pwsh
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/manju-summoner/YukkuriMovieMaker4/releases/latest'
          $asset = $release.assets | Where-Object name -Like '*_Lite.zip' | Select-Object -First 1
          if (-not $asset) { throw 'YMM4 Lite archive was not found' }
          Invoke-WebRequest $asset.browser_download_url -OutFile ymm4.zip
          Expand-Archive ymm4.zip -DestinationPath ymm4-host
          $exe = Get-ChildItem ymm4-host -Recurse -Filter YukkuriMovieMaker.exe | Select-Object -First 1
          if (-not $exe) { throw 'YukkuriMovieMaker.exe was not found' }
          "YMM4_DIR=$($exe.Directory.FullName)\" >> $env:GITHUB_ENV

      - name: Find Windows SDK shader tools
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
            Where-Object FullName -Like '*\x64\fxc.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          $include = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Recurse -Filter d2d1effecthelpers.hlsli |
            Select-Object -First 1
          if (-not $fxc -or -not $include) { throw 'Direct2D shader tools were not found' }
          "FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
          "D2D_INCLUDE=$($include.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Build and verify
        shell: pwsh
        run: |
          Get-ChildItem effects -Directory | ForEach-Object {
            $name = $_.Name
            dotnet build "effects/$name/$name.csproj" -c Release "-p:YMM4DirPath=$env:YMM4_DIR" "-p:FxcPath=$env:FXC_PATH" "-p:D2DIncludePath=$env:D2D_INCLUDE"
            if ($LASTEXITCODE -ne 0) { throw "$name build failed" }
            $binary = "effects/$name/obj/Release/net10.0-windows10.0.19041.0/Shader.cso"
            $assembly = (& $env:FXC_PATH /dumpbin $binary | Out-String)
            if ($LASTEXITCODE -ne 0 -or $assembly -notmatch 'SCENE_POSITION' -or $assembly -notmatch 'TEXCOORD') {
              throw "$name is missing Direct2D scene/texture coordinates"
            }
          }

      - name: Enable MSVC for WARP validation
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          "PATH=$env:PATH" >> $env:GITHUB_ENV
          "INCLUDE=$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$env:LIB" >> $env:GITHUB_ENV

      - name: Validate production HLSL on Direct3D WARP
        shell: pwsh
        run: ./tests/structures/check-warp.ps1 -FxcPath $env:FXC_PATH

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: StructureWarpTests
          path: warp-results/*.json

      - name: Package independent DLLs
        shell: pwsh
        run: |
          Get-ChildItem effects -Directory | ForEach-Object {
            $name = $_.Name
            New-Item -ItemType Directory "artifact/$name" -Force | Out-Null
            Copy-Item "effects/$name/bin/Release/net10.0-windows10.0.19041.0/$name.dll" "artifact/$name/"
          }
          Copy-Item README.md artifact/
          Compress-Archive artifact/* SaBeta3Ymm.zip
          $names = (Get-Content tests/structures/effects.json -Raw | ConvertFrom-Json).names
          New-Item -ItemType Directory structures-package -Force | Out-Null
          foreach ($name in $names) { Copy-Item "artifact/$name" structures-package/ -Recurse }
          Copy-Item docs/structures/README.md structures-package/
          Compress-Archive structures-package/* SaBeta3StructuresYmm.zip

      - uses: actions/upload-artifact@v7
        with:
          name: SaBeta3Ymm
          path: SaBeta3Ymm.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: SaBeta3StructuresYmm
          path: SaBeta3StructuresYmm.zip
          if-no-files-found: error
