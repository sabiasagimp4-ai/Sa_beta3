name: Shared HLSL core tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow
      - run: python tests/runtime.py
      - run: OMP_NUM_THREADS=4 python tests/test_core.py
